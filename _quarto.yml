# ─────────────────────────────────────────────────────────────────────────────
# _quarto.yml · Configuración del blog "AstroPy en Español"
# Tema: "Observatorio nocturno" (modo oscuro)
# ─────────────────────────────────────────────────────────────────────────────

project:
  type: website
  output-dir: _site

lang: es                      # etiquetas y fechas en español ("Autor/a", "1 de noviembre")

website:
  title: "AstroPy en Español"
  description: "Aprende astronomía computacional con Python y Astropy, desde cero hasta análisis profesional"
  favicon: assets/logos/favicon.ico

  # ── Vista previa al compartir en redes (LinkedIn, Facebook, X, WhatsApp) ────
  site-url: https://fvelez78.github.io/astropy-blog/   # dirección pública del blog
  image: assets/images/tarjeta-redes.png               # imagen 1200×630 por defecto
  open-graph: true                                     # LinkedIn, Facebook, WhatsApp
  twitter-card: true                                   # X (Twitter)
  page-navigation: true       # enlaces "anterior / siguiente" al pie de cada sección
  back-to-top-navigation: true

  # ── Barra superior ──────────────────────────────────────────────────────────
  navbar:
    # El título "AstroPy en Español" ya lleva a la página de inicio
    left:
      - href: posts/basico/01-introduccion.qmd
        text: Secciones
      - href: sobre.qmd
        text: Sobre el blog
    right:
      - icon: github
        href: https://github.com/fvelez78/astropy-blog
        aria-label: GitHub

  # ── Menú lateral con los tres niveles ───────────────────────────────────────
  # Los títulos de cada sección se toman automáticamente de su encabezado YAML
  sidebar:
    style: "docked"
    search: true
    collapse-level: 2
    contents:
      - text: "Inicio"
        href: index.qmd
      - section: "Nivel 1 · Básico"
        contents:
          - posts/basico/01-introduccion.qmd
          - posts/basico/02-unidades.qmd
          - posts/basico/03-tiempo.qmd
          - posts/basico/04-coordenadas.qmd
          - posts/basico/05-tablas.qmd
      - section: "Nivel 2 · Intermedio"
        contents:
          - posts/intermedio/06-fits.qmd
          - posts/intermedio/07-wcs.qmd
          - posts/intermedio/08-fotometria.qmd
          - posts/intermedio/09-visualizacion.qmd
          - posts/intermedio/10-estadistica.qmd
          - posts/intermedio/11-catalogos.qmd
      - section: "Nivel 3 · Avanzado"
        contents:
          - posts/avanzado/12-espectroscopia.qmd
          - posts/avanzado/13-cosmologia.qmd
          - posts/avanzado/14-orbital.qmd
          - posts/avanzado/15-series-temporales.qmd
          - posts/avanzado/16-extensiones.qmd
          - posts/avanzado/17-pipeline.qmd

  page-footer:
    left: "AstroPy en Español · Blog de astronomía computacional"
    right: "Hecho con [Quarto](https://quarto.org) y [Astropy](https://www.astropy.org)"

format:
  html:
    theme: [darkly, assets/css/estilo-blog.scss]   # base oscura + estilos propios
    highlight-style: nord                            # colores de código para fondo oscuro
    code-copy: true
    code-tools: true
    toc: true
    toc-location: right
    toc-depth: 3
    toc-title: "En esta página"
    smooth-scroll: true

execute:
  freeze: auto
  cache: true

jupyter: python3
